services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "monitor.worker"]
    env_file: .env
    volumes:
      - data:/data
    restart: unless-stopped
  # Optional HTTPS front end: docker compose --profile https up -d
  caddy:
    image: caddy:2.8.4
    profiles: ["https"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped
volumes:
  data:
  caddy_data:
