<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VulnScan - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <h1>VulnScan Monitor</h1>

      <button type="submit">Log in</button>

</html>
