<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VulnScan - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <h1>VulnScan: Vulnerability Assessment Tool</h1>
    <form method="POST">
      <label for="target_url">Target URL:</label>
      <input type="text" id="target_url" name="target_url" placeholder="https://example.com">
      <button type="submit">Start Scan</button>
    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
  </body>
</html>
